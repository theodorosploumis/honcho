# Honcho Docker Compose
#
# Usage:
#   cp docker-compose.yml.example docker-compose.yml
#   cp .env.template .env  # edit with your provider config
#   docker compose up -d --build
#   INSTALL_LANCEDB=true docker compose up -d --build  # optional local vector store
#
# By default, ports are bound to 127.0.0.1 (localhost only).
# For development, uncomment the source mounts and monitoring services below.
#
# Host port defaults are shifted (API 18000, MCP 13000) to avoid ports
# already taken on this server (8000, 3000).

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_LANCEDB: ${INSTALL_LANCEDB:-false}
    entrypoint: ["sh", "docker/entrypoint.sh"]
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-18000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      # Shared LanceDB data (used when VECTOR_STORE_TYPE=lancedb)
      - lancedb-data:/app/lancedb_data
      # -- Development: mount source for live reload --
      # - .:/app
      # - venv:/app/.venv
    environment:
      - DB_CONNECTION_URI=postgresql+psycopg://postgres:postgres@database:5432/postgres
      - CACHE_URL=redis://redis:6379/0?suppress=true
      - CACHE_ENABLED=true
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

  deriver:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_LANCEDB: ${INSTALL_LANCEDB:-false}
    entrypoint: ["/app/.venv/bin/python", "-m", "src.deriver"]
    depends_on:
      api:
        condition: service_healthy
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Shared LanceDB data (used when VECTOR_STORE_TYPE=lancedb)
      - lancedb-data:/app/lancedb_data
      # -- Development: mount source for live reload --
      # - .:/app
      # - venv:/app/.venv
    environment:
      - DB_CONNECTION_URI=postgresql+psycopg://postgres:postgres@database:5432/postgres
      - CACHE_URL=redis://redis:6379/0?suppress=true
      - CACHE_ENABLED=true
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

  mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MCP_PORT:-13000}:3000"
    environment:
      - HONCHO_API_URL=http://api:8000
    env_file:
      - path: .env
        required: false
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # OpenConcho web UI for browsing and managing this Honcho instance.
  # Its same-origin API proxy reaches Honcho through Compose DNS at api:8000.
  openconcho:
    image: ghcr.io/offendingcommit/openconcho-web:latest
    pull_policy: always
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "8080"
    environment:
      OPENCONCHO_DEFAULT_HONCHO_URL: ${OPENCONCHO_DEFAULT_HONCHO_URL:-http://api:8000}
      OPENCONCHO_UPSTREAM_ALLOWLIST: ${OPENCONCHO_UPSTREAM_ALLOWLIST:?Set to api and add trusted hosts if needed}
    restart: unless-stopped

  # Require credentials before forwarding requests to OpenConcho.
  # For Coolify, route the dashboard domain to this service on port 8080.
  openconcho-auth:
    image: caddy:2-alpine
    depends_on:
      - openconcho
    ports:
      - "127.0.0.1:${OPENCONCHO_PORT:-18080}:8080"
    entrypoint: ["/bin/sh"]
    command:
      - "-ec"
      - |
        cat > /tmp/Caddyfile <<'EOF'
        :8080 {
          basic_auth {
            {$$OPENCONCHO_AUTH_USER} {$$OPENCONCHO_AUTH_PASSWORD_HASH}
          }
          reverse_proxy openconcho:8080
        }
        EOF
        caddy fmt --overwrite /tmp/Caddyfile
        exec caddy run --config /tmp/Caddyfile --adapter caddyfile
    environment:
      OPENCONCHO_AUTH_USER: ${OPENCONCHO_AUTH_USER:?Set OPENCONCHO_AUTH_USER for dashboard access}
      OPENCONCHO_AUTH_PASSWORD_HASH: ${OPENCONCHO_AUTH_PASSWORD_HASH:?Set OPENCONCHO_AUTH_PASSWORD_HASH to a Caddy bcrypt hash}
    restart: unless-stopped

  database:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      # Allow passwordless connections from the host (port is bound to 127.0.0.1).
      # Lets the local test suite and ad-hoc tools connect without supplying a
      # password. Do NOT use this in production.
      - POSTGRES_HOST_AUTH_METHOD=trust
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-postgres}\" -d \"$${POSTGRES_DB:-postgres}\""]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -- Development: monitoring stack (uncomment to enable) --
  # Secured definitions kept here for re-enablement: Prometheus enforces HTTP
  # basic auth (hash in docker/prometheus-web.yml) and Grafana takes its admin
  # credentials from .env. See .env.template for the variables.
  # prometheus:
  #   image: prom/prometheus:v3.2.1
  #   ports:
  #     - "127.0.0.1:${PROMETHEUS_PORT:-19090}:9090"
  #   command:
  #     - "--config.file=/etc/prometheus/prometheus.yml"
  #     - "--web.config.file=/etc/prometheus/web.yml"
  #     - "--storage.tsdb.path=/prometheus"
  #     - "--web.console.libraries=/usr/share/prometheus/console_libraries"
  #     - "--web.console.templates=/usr/share/prometheus/consoles"
  #   volumes:
  #     - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #     - ./docker/prometheus-web.yml:/etc/prometheus/web.yml:ro
  #     - prometheus-data:/prometheus
  #   depends_on:
  #     api:
  #       condition: service_started
  # grafana:
  #   image: grafana/grafana:11.4.0
  #   ports:
  #     - "127.0.0.1:${GRAFANA_PORT:-19091}:3000"
  #   environment:
  #     - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
  #     - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
  #     - GF_AUTH_ANONYMOUS_ENABLED=${GRAFANA_ANONYMOUS_ENABLED:-false}
  #     - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
  #     # Credentials for the provisioned Prometheus datasource
  #     # ($__env{} references in docker/grafana-datasource.yml).
  #     - PROMETHEUS_AUTH_USER=${PROMETHEUS_AUTH_USER:-prometheus}
  #     - PROMETHEUS_AUTH_PASSWORD=${PROMETHEUS_AUTH_PASSWORD}
  #   volumes:
  #     - ./docker/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
  #   depends_on:
  #     prometheus:
  #       condition: service_started

volumes:
  pgdata:
  redis-data:
  lancedb-data:
  # -- Development: uncomment if using source mounts --
  # venv:
  # prometheus-data:
